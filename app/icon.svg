<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente Oficial Apple Blue para o Elo Direito -->
    <linearGradient id="cxBlueGradIcon" x1="50" y1="16" x2="102" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#0066CC" />
    </linearGradient>

    <!-- Gradiente Especular Titânio para o Elo Esquerdo "C" -->
    <linearGradient id="cxTitaniumGradIcon" x1="18" y1="16" x2="65" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>

  <!-- Cartão Base Squircle Apple Midnight (#0B0E14, rx=28) -->
  <rect width="120" height="120" rx="28" fill="#0B0E14" />
  <rect x="1" y="1" width="118" height="118" rx="27" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" fill="none" />

  <!-- Símbolo The Equilibrium Link (Opção 1) Centralizado Verticalmente (y=18) -->
  <g transform="translate(0, 18)">
    <!-- Camada 1: Elo Esquerdo "C" em Titânio (#F8FAFC) cx=44, cy=42, r=26 -->
    <path
      d="M 64.49 25.99 A 26 26 0 1 0 64.49 58.01"
      stroke="url(#cxTitaniumGradIcon)"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Intersecção Superior: Recorte de 3.5px (stroke-width=17) com a cor do fundo -->
    <path
      d="M 76 16 A 26 26 0 0 0 52 32"
      stroke="#0B0E14"
      stroke-width="17"
      stroke-linecap="butt"
      fill="none"
    />

    <!-- Camada 2: Elo Direito Anel Completo em Apple Blue (#0A84FF) cx=76, cy=42, r=26 -->
    <circle
      cx="76"
      cy="42"
      r="26"
      stroke="url(#cxBlueGradIcon)"
      stroke-width="10"
      fill="none"
    />

    <!-- Intersecção Inferior: Recorte de 3.5px no azul (stroke-width=17) -->
    <path
      d="M 44 68 A 26 26 0 0 0 64.49 58.01"
      stroke="#0B0E14"
      stroke-width="17"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Camada 3: Arco do Elo Branco ("C") passando por cima na base -->
    <path
      d="M 44 68 A 26 26 0 0 0 64.49 58.01"
      stroke="url(#cxTitaniumGradIcon)"
      stroke-width="10"
      stroke-linecap="round"
      fill="none"
    />
  </g>
</svg>
